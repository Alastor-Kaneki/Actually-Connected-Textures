name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # r28c: the NDK the released mod is built with
  NDK_VERSION: "28.2.13676358"
  # Hook API headers. Override with the repository variables PRELOADER_HEADERS_REPO / _REF.
  PRELOADER_REPO: ${{ vars.PRELOADER_HEADERS_REPO || 'LiteLDev/preloader-android' }}
  PRELOADER_REF: ${{ vars.PRELOADER_HEADERS_REF || '5d108da350ce3e7f13f51415f81e65344ecd5d14' }}

jobs:
  mod:
    name: Connected Textures mod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Tile logic tests (host)
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Imod/src mod/tests/host_test.cpp -o "$RUNNER_TEMP/host_test"
          "$RUNNER_TEMP/host_test" unit

      - name: Python syntax
        run: python3 -m compileall -q converter tools mod/package.py

      - name: Get preloader-android headers
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PRELOADER_REPO }}
          ref: ${{ env.PRELOADER_REF }}
          path: .deps/preloader-android

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build and package the .levipack
        working-directory: mod
        run: |
          sh build.sh
          python3 package.py

      - uses: actions/upload-artifact@v7
        with:
          name: ConnectedTextures-levipack
          path: mod/build/ConnectedTextures.levipack
          if-no-files-found: error

  app:
    name: CTM Forge app
    needs: mod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.CTM_FORGE_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: ctm-forge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Bundle the mod built above
        uses: actions/download-artifact@v7
        with:
          name: ConnectedTextures-levipack
          path: ctm-forge/app/src/main/assets

      - name: Restore the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ctmforge-release.jks"
          echo "CTM_KEYSTORE_FILE=$RUNNER_TEMP/ctmforge-release.jks" >> "$GITHUB_ENV"

      - name: Releases need the real key
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Add the CTM_FORGE_* signing secrets before tagging a release (see README)."
          exit 1

      - name: Tests
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build the APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          CTM_KEYSTORE_PASSWORD: ${{ secrets.CTM_FORGE_KEYSTORE_PASSWORD }}
          CTM_KEY_ALIAS: ${{ secrets.CTM_FORGE_KEY_ALIAS }}
          CTM_KEY_PASSWORD: ${{ secrets.CTM_FORGE_KEY_PASSWORD }}

      - name: Name the APK
        run: |
          code=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CTM-Forge-$code.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: CTM-Forge-apk
          path: ctm-forge/dist/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            ctm-forge/core/build/reports/tests/
            ctm-forge/app/build/reports/tests/

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mod, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/*.levipack
          generate_release_notes: true
