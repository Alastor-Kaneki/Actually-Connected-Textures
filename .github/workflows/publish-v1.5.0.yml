name: Publish tested v1.5.0

on:
  push:
    branches: ["release/publish-v1.5.0"]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-connected-textures-v1.5.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: "42936687843"
      BUILD_SHA: b262bf91a7ae36413c881e3ca7bd749fa9d068a4
      TARGET_SHA: ad672970afc4e36753e30fcce50bc118fededb3a
      RELEASE_ID: "441149478"
    steps:
      - name: Verify tested source and existing draft assets
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          gh api "repos/$GH_REPO/git/commits/$BUILD_SHA" > build.json
          gh api "repos/$GH_REPO/git/commits/$TARGET_SHA" > target.json
          # Draft releases do not resolve through /releases/tags until published.
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > release.json
          python3 - <<'PY'
          import json, os
          run = json.load(open("run.json"))
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["head_sha"] == os.environ["BUILD_SHA"]
          assert json.load(open("build.json"))["tree"]["sha"] == json.load(open("target.json"))["tree"]["sha"]
          release = json.load(open("release.json"))
          assert release["id"] == int(os.environ["RELEASE_ID"])
          assert release["tag_name"] == "v1.5.0" and not release["prerelease"]
          assert release["target_commitish"] == os.environ["TARGET_SHA"]
          assets = {a["name"]: a for a in release["assets"]}
          expected = {
              "ConnectedTextures.levipack": "f9027b09e24d4152ba251ade2b82b0e03a177dc1b81df2ca8619ba82813af4ac",
              "CTM-Forge-14.apk": "22eb98daebf87b3844549c2f6be72d493932fa61c003dd3cf7ffd3942b7339eb",
          }
          assert set(assets) == set(expected)
          for name, digest in expected.items():
              assert assets[name]["state"] == "uploaded"
              assert assets[name]["digest"] == "sha256:" + digest
          print("Existing release assets match the tested build")
          PY

      - name: Publish the verified release as latest
        run: |
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true > published.json
          python3 - <<'PY'
          import json
          release = json.load(open("published.json"))
          assert not release["draft"] and not release["prerelease"]
          assert release["tag_name"] == "v1.5.0" and release["published_at"]
          print(release["html_url"])
          PY
          gh api "repos/$GH_REPO/git/ref/tags/v1.5.0" > tag.json
          python3 - <<'PY'
          import json, os
          assert json.load(open("tag.json"))["object"]["sha"] == os.environ["TARGET_SHA"]
          print("Release tag points to the tested merged source")
          PY
