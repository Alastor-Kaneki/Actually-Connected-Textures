name: Publish tested v1.6.0

on:
  push:
    branches: ["release/publish-v1.6.0"]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-connected-textures-v1.6.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: "42944959826"
      BUILD_SHA: c923e13f46d29f4b031fb8173f8b27a8bd555e0c
      TARGET_SHA: 854567cf0a6c4038078556b60fa7cd1e73d2784f
      MOD_SHA256: 4cfff76d0befccc62319410560a6c39baaedddfd93989b14691440835e1a66a2
      APK_SHA256: 242c53853ec5b6ad45deef34619744ca6587ad36fd25f5d4129d513c400b673b
    steps:
      - name: Verify tested source
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          gh api "repos/$GH_REPO/git/commits/$BUILD_SHA" > build.json
          gh api "repos/$GH_REPO/git/commits/$TARGET_SHA" > target.json
          python3 - <<'PY'
          import json, os
          run = json.load(open("run.json"))
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["head_sha"] == os.environ["BUILD_SHA"]
          assert json.load(open("build.json"))["tree"]["sha"] == json.load(open("target.json"))["tree"]["sha"]
          print("Successful build matches the merged source")
          PY

      - name: Download and verify tested artifacts
        run: |
          gh run download "$BUILD_RUN_ID" --name ConnectedTextures-levipack --dir dist
          gh run download "$BUILD_RUN_ID" --name CTM-Forge-apk --dir dist
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          for name, key in [("ConnectedTextures.levipack", "MOD_SHA256"), ("CTM-Forge-15.apk", "APK_SHA256")]:
              assert hashlib.sha256(Path("dist", name).read_bytes()).hexdigest() == os.environ[key]
          with zipfile.ZipFile("dist/ConnectedTextures.levipack") as mod:
              assert json.loads(mod.read("manifest.json"))["version"] == "1.6.0"
              assert len(json.loads(mod.read("resources/minecraft_resource_packs/ctm_defaults/blocks.json"))) - 1 == 42
          with zipfile.ZipFile("dist/CTM-Forge-15.apk") as apk:
              assert apk.read("assets/ConnectedTextures.levipack") == Path("dist/ConnectedTextures.levipack").read_bytes()
          print("Verified both artifacts and the APK's embedded mod")
          PY

      - name: Create draft release and upload verified assets
        run: |
          python3 - <<'PY'
          import json, os
          notes = """Continuity's default connected textures are now built into the mod and enabled automatically. No separate resource-pack import or manual Global Resources activation is needed on LeviLauncher 1.5.27+.

          - Clear, tinted and all 16 stained glass colors, plus glass panes.
          - Connected bookshelves, cut/chiseled sandstone and red variants; vertical side connections on normal/red sandstone full blocks.
          - New Default Connected Textures switch (on by default). Full Grass Sides and Whiter Snow remain independent and off by default.
          - Original Continuity textures/rules, adapted rule sources, credits and LGPL/GPL license texts are included. This uses our Bedrock renderer; it does not run Java Continuity code.
          - CTM Forge build 15 (Overlay) bundles the same mod 1.6.0.

          **Install:** import ConnectedTextures.levipack, enable the mod, then fully stop LeviLauncher in Android Settings > Apps > LeviLauncher > Force stop before reopening and launching Minecraft. Also restart after changing built-in switches. Disable BedrockTools' Connected Glass option if enabled.

          **Texture packs:** higher-priority converted CTM packs can override the defaults. For plain replacement textures, turn off Default Connected Textures: Java resourceCondition checks and Programmer Art variants are not supported. Smooth sandstone and shaped-block artwork are not added by this bundle.

          **Validation:** native tile/activation tests, Python conversion and source-pixel checks, Kotlin/Android unit tests, native arm64 build and APK build passed. Both assets come from the successful CI build; the APK's embedded mod matches the standalone download. In-game rendering still needs device verification.
          """
          payload = {"tag_name": "v1.6.0", "target_commitish": os.environ["TARGET_SHA"], "name": "Connected Textures 1.6.0 / CTM Forge 15 — Continuity defaults", "body": notes, "draft": True, "prerelease": False}
          with open("create.json", "w") as f:
              json.dump(payload, f)
          PY
          gh api --method POST "repos/$GH_REPO/releases" --input create.json > draft.json
          python3 - <<'PY'
          import json, os
          release = json.load(open("draft.json"))
          assert release["draft"] and release["tag_name"] == "v1.6.0"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RELEASE_ID={release['id']}\n")
          PY
          gh release upload v1.6.0 dist/ConnectedTextures.levipack dist/CTM-Forge-15.apk

      - name: Verify uploaded assets and publish as latest
        run: |
          # Draft tags do not resolve via /releases/tags; use the returned release ID.
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > release.json
          python3 - <<'PY'
          import json, os
          release = json.load(open("release.json"))
          assert release["draft"] and not release["prerelease"]
          assert release["target_commitish"] == os.environ["TARGET_SHA"]
          assets = {a["name"]: a for a in release["assets"]}
          expected = {"ConnectedTextures.levipack": os.environ["MOD_SHA256"], "CTM-Forge-15.apk": os.environ["APK_SHA256"]}
          assert set(assets) == set(expected)
          for name, digest in expected.items():
              assert assets[name]["state"] == "uploaded"
              assert assets[name]["digest"] == "sha256:" + digest
          PY
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true > published.json
          gh api "repos/$GH_REPO/git/ref/tags/v1.6.0" > tag.json
          python3 - <<'PY'
          import json, os
          release = json.load(open("published.json"))
          assert not release["draft"] and not release["prerelease"]
          assert release["tag_name"] == "v1.6.0" and release["published_at"]
          assert json.load(open("tag.json"))["object"]["sha"] == os.environ["TARGET_SHA"]
          print(release["html_url"])
          PY
